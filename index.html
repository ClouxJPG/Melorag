<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nowcast Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body,#map{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#0b0f14;
    color:#fff;
}

#map{
    position:absolute;
    inset:0;
    background:#111820;
}

/* Верхняя панель */

.top{
    position:absolute;
    z-index:1000;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(720px,calc(100% - 24px));
    min-height:52px;
    padding:8px 12px;

    display:flex;
    align-items:center;
    gap:12px;

    background:rgba(13,17,23,.93);
    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;

    backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.logo{
    font-size:16px;
    font-weight:750;
    white-space:nowrap;
}

.status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
    color:#aab4c1;
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
}

.dot.ok{
    background:#35d47a;
    box-shadow:0 0 9px #35d47a;
}

.dot.load{
    background:#f2b84b;
}

/* Панель */

.panel{
    position:absolute;
    z-index:1000;
    top:76px;
    right:12px;

    width:235px;
    padding:12px;

    background:rgba(13,17,23,.93);
    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;

    backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.title{
    font-weight:700;
    font-size:14px;
    margin-bottom:9px;
}

.layer{
    display:flex;
    align-items:center;
    gap:9px;

    padding:10px;

    background:rgba(255,255,255,.05);
    border-radius:9px;
}

.layer input{
    width:18px;
    height:18px;
}

.layer b{
    font-size:13px;
}

.layer small{
    display:block;
    color:#8d98a7;
    font-size:10px;
    margin-top:2px;
}

.buttons{
    display:flex;
    gap:6px;
    margin-top:8px;
}

button{
    flex:1;
    border:0;
    border-radius:9px;
    padding:9px;

    background:#252c35;
    color:#fff;

    font-size:12px;
    font-weight:650;
}

button.primary{
    background:#315eea;
}

/* Таймлайн */

.timeline{
    position:absolute;
    z-index:1000;

    left:50%;
    transform:translateX(-50%);
    bottom:12px;

    width:min(850px,calc(100% - 24px));

    padding:11px 13px;

    background:rgba(13,17,23,.94);
    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;

    backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.time{
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
}

.time b{
    font-size:13px;
}

.time span{
    color:#8994a3;
    font-size:11px;
}

input[type=range]{
    width:100%;
    accent-color:#4775ff;
}

.controls{
    display:flex;
    gap:6px;
    margin-top:7px;
}

.controls button{
    height:34px;
}

.play{
    flex:1;
    background:#315eea;
}

/* Загрузка */

.loading{
    position:absolute;
    z-index:1200;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    padding:12px 17px;

    background:rgba(8,11,15,.94);
    border-radius:11px;

    font-size:13px;
}

.hidden{
    display:none;
}

/* Мобильный интерфейс */

@media(max-width:600px){

    .top{
        top:8px;
        width:calc(100% - 16px);
        min-height:46px;
    }

    .logo{
        font-size:14px;
    }

    .status{
        font-size:10px;
    }

    .panel{
        top:64px;
        right:8px;
        width:205px;
    }

    .timeline{
        bottom:8px;
        width:calc(100% - 16px);
        padding:9px 10px;
    }
}

@media(max-width:390px){

    .status{
        display:none;
    }

    .panel{
        width:195px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">

    <div class="logo">
        NOWCAST RADAR
    </div>

    <div class="status">

        <span
            id="dot"
            class="dot"
        ></span>

        <span id="status">
            Подключение...
        </span>

    </div>

</div>


<div class="panel">

    <div class="title">
        Радарные слои
    </div>

    <label class="layer">

        <input
            id="radar"
            type="checkbox"
            checked
        >

        <div>
            <b>Nowcast DBZ</b>
            <small>Радиолокационная отражаемость</small>
        </div>

    </label>

    <div class="buttons">

        <button
            class="primary"
            id="refresh"
        >
            Обновить
        </button>

        <button id="russia">
            Россия
        </button>

    </div>

</div>


<div
    id="loading"
    class="loading hidden"
>
    Загрузка радара...
</div>


<div class="timeline">

    <div class="time">

        <b id="time">
            Нет данных
        </b>

        <span id="count">
            0 кадров
        </span>

    </div>

    <input
        id="slider"
        type="range"
        min="0"
        max="0"
        value="0"
    >

    <div class="controls">

        <button id="prev">
            ◀
        </button>

        <button
            id="play"
            class="play"
        >
            ▶ Воспроизвести
        </button>

        <button id="next">
            ▶
        </button>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const WORKER =
"https://melorag.mmts2678.workers.dev/nowcast?url=";

const LAYERS =
"bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";

const BBOX = [
3779329.325563706,
6713602.321820984,
4547368.585773157,
8244788.872429635
];

const GRID = 4;


/* Карта */

const map =
L.map("map",{
    zoomControl:true,
    attributionControl:true
});

L.tileLayer(
"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
{
    maxZoom:19,
    attribution:"© OpenStreetMap © CARTO"
}
).addTo(map);

map.setView(
[57,80],
4
);


/* Элементы */

const status =
document.getElementById("status");

const dot =
document.getElementById("dot");

const loading =
document.getElementById("loading");

const timeBox =
document.getElementById("time");

const countBox =
document.getElementById("count");

const slider =
document.getElementById("slider");

const radarToggle =
document.getElementById("radar");


let radarLayer =
null;

let currentBlob =
null;


/* Статус */

function setStatus(
text,
ok=false
){

    status.textContent =
    text;

    dot.className =
    "dot " +
    (ok ? "ok" : "load");

}


/* Время */

function formatTime(
time
){

    return new Date(
        time
    ).toLocaleString(
        "ru-RU",
        {
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            timeZone:"UTC"
        }
    ) + " UTC";

}


/* Получение токена
   теперь НЕ из браузера,
   а только через Worker
*/

async function getRadar(
time
){

    const url =
    new URL(
        "https://www.nowcast.ru/baltrad_wsgi"
    );

    url.searchParams.set(
        "REQUEST",
        "GetMap"
    );

    url.searchParams.set(
        "SERVICE",
        "WMS"
    );

    url.searchParams.set(
        "VERSION",
        "1.3.0"
    );

    url.searchParams.set(
        "FORMAT",
        "image/png"
    );

    url.searchParams.set(
        "STYLES",
        ""
    );

    url.searchParams.set(
        "TRANSPARENT",
        "TRUE"
    );

    url.searchParams.set(
        "LAYERS",
        LAYERS
    );

    url.searchParams.set(
        "TIME",
        time
    );

    url.searchParams.set(
        "FORMAT_OPTIONS",
        "dpi:270"
    );

    url.searchParams.set(
        "WIDTH",
        "942"
    );

    url.searchParams.set(
        "HEIGHT",
        "1878"
    );

    url.searchParams.set(
        "CRS",
        "EPSG:3857"
    );


    const [
        x1,
        y1,
        x2,
        y2
    ] = BBOX;


    const dx =
    (x2-x1)/GRID;

    const dy =
    (y2-y1)/GRID;


    const requests=[];


    for(
        let y=0;
        y<GRID;
        y++
    ){

        for(
            let x=0;
            x<GRID;
            x++
        ){

            const tile =
            new URL(
                url
            );

            tile.searchParams.set(
                "BBOX",
                [
                    x1+x*dx,
                    y1+y*dy,
                    x1+(x+1)*dx,
                    y1+(y+1)*dy
                ].join(",")
            );

            requests.push(
                fetch(
                    WORKER +
                    encodeURIComponent(
                        tile.href
                    )
                ).then(
                    r=>{
                        if(!r.ok)
                            throw new Error(
                                "Worker "+r.status
                            );

                        return r.blob();
                    }
                )
            );

        }

    }


    const blobs =
    await Promise.all(
        requests
    );


    const images =
    await Promise.all(
        blobs.map(
            b=>createImageBitmap(b)
        )
    );


    const tw =
    images[0].width;

    const th =
    images[0].height;


    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width =
    tw*GRID;

    canvas.height =
    th*GRID;


    const ctx =
    canvas.getContext(
        "2d"
    );


    images.forEach(
        (img,i)=>{

            const x =
            i%GRID;

            const y =
            Math.floor(
                i/GRID
            );

            ctx.drawImage(
                img,
                x*tw,
                y*th
            );

            img.close();

        }
    );


    return new Promise(
        resolve=>
        canvas.toBlob(
            resolve,
            "image/png"
        )
    );

}


/* Показ радара */

function showRadar(
blob,
time
){

    if(radarLayer){

        map.removeLayer(
            radarLayer
        );

    }

    if(currentBlob){

        URL.revokeObjectURL(
            currentBlob
        );

    }

    currentBlob =
    URL.createObjectURL(
        blob
    );


    /*
      Географическая область
      соответствует текущему BBOX.
    */

    radarLayer =
    L.imageOverlay(
        currentBlob,
        [
            [54.7,33.9],
            [66.8,40.8]
        ],
        {
            opacity:.9,
            interactive:false
        }
    ).addTo(map);


    timeBox.textContent =
    formatTime(
        time
    );

    countBox.textContent =
    "Nowcast DBZ";

}


/* Текущий кадр */

async function loadCurrent(){

    try{

        loading.classList.remove(
            "hidden"
        );

        loading.textContent =
        "Получение Nowcast...";

        setStatus(
            "Загрузка...",
            false
        );


        const now =
        new Date();


        now.setUTCSeconds(
            0,
            0
        );

        now.setUTCMinutes(
            Math.floor(
                now.getUTCMinutes()/10
            )*10
        );


        const iso =
        now.toISOString()
        .replace(
            ".000Z",
            "Z"
        );


        const blob =
        await getRadar(
            iso
        );


        showRadar(
            blob,
            iso
        );


        slider.max=0;
        slider.value=0;


        setStatus(
            "Nowcast подключён",
            true
        );


        loading.classList.add(
            "hidden"
        );


    }catch(e){

        console.error(e);

        setStatus(
            "Ошибка загрузки",
            false
        );

        loading.textContent =
        "Ошибка: " +
        e.message;

    }

}


/* Кнопки */

document.getElementById(
"refresh"
).onclick =
loadCurrent;


document.getElementById(
"russia"
).onclick =
()=>{
    map.setView(
        [58,90],
        3
    );
};


radarToggle.onchange =
()=>{

    if(!radarLayer)
        return;

    if(
        radarToggle.checked
    )
        radarLayer.addTo(map);
    else
        map.removeLayer(
            radarLayer
        );

};


/* Первый запуск */

loadCurrent();


/* Автообновление */

setInterval(
loadCurrent,
60000
);

</script>

</body>
</html>
