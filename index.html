<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NOWCAST RADAR</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body,#map{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#10151c;
    color:#fff;
}

#map{
    position:absolute;
    inset:0;
}


/* ---------- TOP ---------- */

.topbar{
    position:absolute;
    z-index:2000;

    top:12px;
    left:50%;
    transform:translateX(-50%);

    width:min(720px,calc(100% - 24px));

    min-height:52px;

    padding:8px 13px;

    display:flex;
    align-items:center;
    gap:12px;

    background:rgba(12,16,22,.94);

    border:1px solid rgba(255,255,255,.11);
    border-radius:15px;

    backdrop-filter:blur(15px);

    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.logo{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
}

.connection{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:7px;

    font-size:12px;
    color:#aeb8c6;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#f1b64a;
}

.status-dot.ok{
    background:#38d477;
    box-shadow:0 0 10px rgba(56,212,119,.8);
}

.status-dot.error{
    background:#ff4c4c;
}


/* ---------- RIGHT PANEL ---------- */

.panel{
    position:absolute;
    z-index:2000;

    top:76px;
    right:12px;

    width:235px;

    padding:12px;

    background:rgba(12,16,22,.94);

    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;

    backdrop-filter:blur(15px);

    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.panel-title{
    font-size:14px;
    font-weight:750;
    margin-bottom:9px;
}

.layer{
    display:flex;
    align-items:center;
    gap:9px;

    padding:10px;

    background:rgba(255,255,255,.055);

    border-radius:9px;
}

.layer input{
    width:18px;
    height:18px;
}

.layer-name{
    font-size:13px;
    font-weight:700;
}

.layer-desc{
    margin-top:2px;
    font-size:10px;
    color:#8e99a8;
}

.buttons{
    display:flex;
    gap:6px;
    margin-top:8px;
}

button{
    flex:1;

    height:34px;

    border:0;
    border-radius:9px;

    background:#272f39;
    color:white;

    font-size:12px;
    font-weight:700;
}

button.primary{
    background:#315eea;
}


/* ---------- TIMELINE ---------- */

.timeline{
    position:absolute;
    z-index:2000;

    bottom:12px;
    left:50%;
    transform:translateX(-50%);

    width:min(850px,calc(100% - 24px));

    padding:11px 13px;

    background:rgba(12,16,22,.95);

    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;

    backdrop-filter:blur(15px);

    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.time-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:5px;
}

.time{
    font-size:13px;
    font-weight:750;
}

.frames{
    color:#8995a4;
    font-size:11px;
}


/* ---------- SHORT + THICK SLIDER ---------- */

#slider{
    appearance:none;
    -webkit-appearance:none;

    width:70%;

    height:34px;

    display:block;

    margin:0 auto;

    background:transparent;

    cursor:pointer;
}

#slider::-webkit-slider-runnable-track{
    height:16px;

    border-radius:16px;

    background:#3c4551;
}

#slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;

    width:32px;
    height:32px;

    margin-top:-8px;

    border-radius:50%;

    background:#4775ff;

    border:2px solid #fff;

    box-shadow:0 2px 10px rgba(0,0,0,.55);
}

#slider::-moz-range-track{
    height:16px;

    border-radius:16px;

    background:#3c4551;
}

#slider::-moz-range-thumb{
    width:32px;
    height:32px;

    border-radius:50%;

    background:#4775ff;

    border:2px solid #fff;
}


/* ---------- CONTROLS ---------- */

.controls{
    display:flex;
    gap:6px;
    margin-top:6px;
}

.controls button{
    height:36px;
}

.play{
    flex:1;
    background:#315eea;
}


/* ---------- LOADING ---------- */

.loading{
    position:absolute;
    z-index:3000;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    max-width:calc(100% - 40px);

    padding:12px 18px;

    border-radius:11px;

    background:rgba(7,10,14,.95);

    font-size:13px;

    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.hidden{
    display:none;
}


/* ---------- MOBILE ---------- */

@media(max-width:600px){

    .topbar{
        top:8px;
        width:calc(100% - 16px);
        min-height:46px;
    }

    .logo{
        font-size:14px;
    }

    .connection{
        font-size:10px;
    }

    .panel{
        top:64px;
        right:8px;
        width:205px;
    }

    .timeline{
        bottom:8px;
        width:calc(100% - 16px);
        padding:9px 10px;
    }

    #slider{
        width:62%;
    }
}

@media(max-width:390px){

    .connection{
        display:none;
    }

    .panel{
        width:195px;
    }
}
</style>
</head>

<body>

<div id="map"></div>


<div class="topbar">

    <div class="logo">
        NOWCAST RADAR
    </div>

    <div class="connection">

        <span
            id="statusDot"
            class="status-dot">
        </span>

        <span id="status">
            Подключение...
        </span>

    </div>

</div>


<div class="panel">

    <div class="panel-title">
        Радарные слои
    </div>

    <label class="layer">

        <input
            id="radarToggle"
            type="checkbox"
            checked
        >

        <div>

            <div class="layer-name">
                Nowcast DBZ
            </div>

            <div class="layer-desc">
                Радиолокационная отражаемость
            </div>

        </div>

    </label>

    <div class="buttons">

        <button
            id="refresh"
            class="primary">
            Обновить
        </button>

        <button id="russia">
            Россия
        </button>

    </div>

</div>


<div
    id="loading"
    class="loading hidden">
    Загрузка...
</div>


<div class="timeline">

    <div class="time-row">

        <div
            id="time"
            class="time">
            Нет данных
        </div>

        <div
            id="frames"
            class="frames">
            0 кадров
        </div>

    </div>


    <input
        id="slider"
        type="range"
        min="0"
        max="0"
        value="0"
        step="1"
    >


    <div class="controls">

        <button id="prev">
            ◀
        </button>

        <button
            id="play"
            class="play">
            ▶ Воспроизвести
        </button>

        <button id="next">
            ▶
        </button>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const WORKER =
    "https://melorag.mmts2678.workers.dev/?url=";


/*
 * Реальные слои из твоего рабочего GetMap.
 */

const LAYERS =
    "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";


/*
 * Твой подтверждённый рабочий BBOX.
 */

const BBOX = [
    3779329.325563706,
    6713602.321820984,
    4547368.585773157,
    8244788.872429635
];


/*
 * Последнее время, которое ты подтвердил
 * как рабочее.
 */

const TEST_TIME =
    "2026-08-30T11:40:00Z";


/* =========================================================
   MAP
========================================================= */

const map =
    L.map(
        "map",
        {
            zoomControl:true
        }
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:
            "© OpenStreetMap contributors"
    }
).addTo(map);


/*
 * Сначала показываем область радара.
 */

map.setView(
    [55,60],
    3
);


/* =========================================================
   UI
========================================================= */

const status =
    document.getElementById("status");

const statusDot =
    document.getElementById("statusDot");

const loading =
    document.getElementById("loading");

const timeBox =
    document.getElementById("time");

const framesBox =
    document.getElementById("frames");

const slider =
    document.getElementById("slider");

const radarToggle =
    document.getElementById("radarToggle");


/* =========================================================
   STATE
========================================================= */

let radarLayer = null;

let objectURL = null;

let frames = [];

let currentIndex = -1;

let playing = false;

let playTimer = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = ""
){

    status.textContent =
        text;

    statusDot.className =
        "status-dot " +
        type;
}


/* =========================================================
   MERCATOR
========================================================= */

function mercatorXToLon(x){

    return (
        x /
        20037508.342789244
    ) * 180;
}


function mercatorYToLat(y){

    return (
        180 / Math.PI
    ) *
    (
        2 *
        Math.atan(
            Math.exp(
                y /
                20037508.342789244 *
                Math.PI /
                180
            )
        )
        -
        Math.PI / 2
    );
}


/* =========================================================
   RADAR BOUNDS
========================================================= */

function getRadarBounds(){

    return L.latLngBounds(

        [
            mercatorYToLat(BBOX[1]),
            mercatorXToLon(BBOX[0])
        ],

        [
            mercatorYToLat(BBOX[3]),
            mercatorXToLon(BBOX[2])
        ]
    );
}


/* =========================================================
   GETMAP URL
========================================================= */

function makeGetMapURL(time){

    const u =
        new URL(
            "https://www.nowcast.ru/baltrad_wsgi"
        );


    u.searchParams.set(
        "REQUEST",
        "GetMap"
    );

    u.searchParams.set(
        "SERVICE",
        "WMS"
    );

    u.searchParams.set(
        "VERSION",
        "1.3.0"
    );

    u.searchParams.set(
        "FORMAT",
        "image/png"
    );

    u.searchParams.set(
        "STYLES",
        ""
    );

    u.searchParams.set(
        "TRANSPARENT",
        "TRUE"
    );

    u.searchParams.set(
        "LAYERS",
        LAYERS
    );

    u.searchParams.set(
        "TIME",
        time
    );

    u.searchParams.set(
        "FORMAT_OPTIONS",
        "dpi:270"
    );

    u.searchParams.set(
        "WIDTH",
        "942"
    );

    u.searchParams.set(
        "HEIGHT",
        "1878"
    );

    u.searchParams.set(
        "CRS",
        "EPSG:3857"
    );

    u.searchParams.set(
        "BBOX",
        BBOX.join(",")
    );


    return u.toString();
}


/* =========================================================
   LOAD RADAR
========================================================= */

async function loadRadar(){

    try{

        loading.classList.remove(
            "hidden"
        );

        loading.textContent =
            "Получение радарного PNG...";

        setStatus(
            "Загрузка..."
        );


        /*
         * Используем подтверждённое
         * рабочее время.
         *
         * Это важно для первой проверки.
         */

        const time =
            TEST_TIME;


        const targetURL =
            makeGetMapURL(
                time
            );


        const workerURL =
            WORKER +
            encodeURIComponent(
                targetURL
            );


        console.log(
            "NOWCAST TARGET:",
            targetURL
        );

        console.log(
            "WORKER:",
            workerURL
        );


        const response =
            await fetch(
                workerURL,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        console.log(
            "HTTP:",
            response.status
        );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "Worker HTTP " +
                response.status +
                ": " +
                errorText.slice(
                    0,
                    250
                )
            );
        }


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        console.log(
            "TYPE:",
            contentType
        );


        const blob =
            await response.blob();


        console.log(
            "PNG:",
            blob.size,
            "bytes"
        );


        /*
         * Защита от ситуации,
         * когда Worker вернул JSON/HTML
         * вместо картинки.
         */

        if(
            !contentType.includes("image") &&
            !blob.type.includes("image")
        ){

            const text =
                await blob.text();

            throw new Error(
                "Вместо PNG получено " +
                (blob.type || contentType) +
                ": " +
                text.slice(
                    0,
                    250
                )
            );
        }


        /*
         * Добавляем кадр.
         */

        frames = [

            {
                time:time,
                blob:blob
            }

        ];


        showFrame(0);


        setStatus(
            "Nowcast подключён",
            "ok"
        );


        loading.classList.add(
            "hidden"
        );


    }catch(error){

        console.error(
            "NOWCAST ERROR:",
            error
        );


        setStatus(
            "Ошибка",
            "error"
        );


        loading.textContent =
            "Ошибка: " +
            error.message;

        loading.classList.remove(
            "hidden"
        );
    }
}


/* =========================================================
   SHOW PNG
========================================================= */

function showFrame(index){

    if(
        index < 0 ||
        index >= frames.length
    ){

        return;
    }


    currentIndex =
        index;


    const frame =
        frames[index];


    /*
     * Старый слой.
     */

    if(radarLayer){

        map.removeLayer(
            radarLayer
        );

        radarLayer = null;
    }


    /*
     * Старый URL.
     */

    if(objectURL){

        URL.revokeObjectURL(
            objectURL
        );

        objectURL = null;
    }


    /*
     * Создаём URL
     * настоящего PNG.
     */

    objectURL =
        URL.createObjectURL(
            frame.blob
        );


    const bounds =
        getRadarBounds();


    console.log(
        "RADAR BOUNDS:",
        bounds
    );


    /*
     * Накладываем PNG.
     */

    radarLayer =
        L.imageOverlay(
            objectURL,
            bounds,
            {
                opacity:1,
                interactive:false,
                zIndex:1000
            }
        );


    if(
        radarToggle.checked
    ){

        radarLayer.addTo(
            map
        );
    }


    /*
     * КЛЮЧЕВОЙ МОМЕНТ:
     *
     * карта автоматически
     * перемещается к PNG.
     */

    map.fitBounds(
        bounds,
        {
            padding:[
                40,
                40
            ],
            animate:false
        }
    );


    /*
     * Проверяем,
     * действительно ли слой добавлен.
     */

    setTimeout(
        () => {

            console.log(
                "RADAR LAYER:",
                radarLayer
            );

            console.log(
                "MAP HAS LAYER:",
                radarLayer &&
                map.hasLayer(
                    radarLayer
                )
            );

        },
        100
    );


    timeBox.textContent =
        new Date(
            frame.time
        ).toLocaleString(
            "ru-RU",
            {
                day:"2-digit",
                month:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                timeZone:"UTC"
            }
        ) +
        " UTC";


    framesBox.textContent =
        (index + 1) +
        " / " +
        frames.length;


    slider.max =
        Math.max(
            0,
            frames.length - 1
        );

    slider.value =
        index;
}


/* =========================================================
   SLIDER
========================================================= */

slider.addEventListener(
    "input",
    () => {

        showFrame(
            Number(
                slider.value
            )
        );
    }
);


/* =========================================================
   PREVIOUS
========================================================= */

document.getElementById(
    "prev"
).onclick =
() => {

    if(
        frames.length === 0
    ){

        return;
    }


    showFrame(
        Math.max(
            0,
            currentIndex - 1
        )
    );
};


/* =========================================================
   NEXT
========================================================= */

document.getElementById(
    "next"
).onclick =
() => {

    if(
        frames.length === 0
    ){

        return;
    }


    showFrame(
        Math.min(
            frames.length - 1,
            currentIndex + 1
        )
    );
};


/* =========================================================
   PLAY
========================================================= */

document.getElementById(
    "play"
).onclick =
() => {

    if(
        frames.length < 2
    ){

        return;
    }


    if(playing){

        playing = false;

        clearInterval(
            playTimer
        );

        document.getElementById(
            "play"
        ).textContent =
            "▶ Воспроизвести";

        return;
    }


    playing = true;

    document.getElementById(
        "play"
    ).textContent =
        "⏸ Пауза";


    playTimer =
        setInterval(
            () => {

                let next =
                    currentIndex + 1;


                if(
                    next >=
                    frames.length
                ){

                    next = 0;
                }


                showFrame(
                    next
                );

            },
            700
        );
};


/* =========================================================
   RADAR CHECKBOX
========================================================= */

radarToggle.onchange =
() => {

    if(!radarLayer){

        return;
    }


    if(
        radarToggle.checked
    ){

        radarLayer.addTo(
            map
        );

    }else{

        map.removeLayer(
            radarLayer
        );
    }
};


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "refresh"
).onclick =
loadRadar;


document.getElementById(
    "russia"
).onclick =
() => {

    map.setView(
        [58,90],
        3
    );
};


/* =========================================================
   START
========================================================= */

loadRadar();

</script>

</body>
</html>
