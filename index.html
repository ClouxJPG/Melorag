<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>Melorag — Nowcast Radar</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body,
#map{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#111;
}

#map{
    position:absolute;
    inset:0;
}


/* =========================
   TOP
========================= */

.topbar{
    position:absolute;
    z-index:1000;

    top:12px;
    left:50%;
    transform:translateX(-50%);

    width:min(
        720px,
        calc(100% - 24px)
    );

    min-height:52px;

    padding:8px 14px;

    display:flex;
    align-items:center;

    gap:12px;

    background:rgba(
        12,
        16,
        22,
        .94
    );

    border:1px solid
        rgba(255,255,255,.11);

    border-radius:15px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);
}

.logo{
    font-size:16px;
    font-weight:750;

    white-space:nowrap;
}

.status{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:7px;

    color:#aab4c2;

    font-size:12px;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#777;
}

.dot.ok{
    background:#32d477;

    box-shadow:
        0 0 9px
        rgba(50,212,119,.7);
}

.dot.loading{
    background:#f2b84b;
}

.dot.error{
    background:#ff4d4d;
}


/* =========================
   PANEL
========================= */

.panel{
    position:absolute;
    z-index:1000;

    top:76px;
    right:12px;

    width:235px;

    padding:12px;

    background:rgba(
        12,
        16,
        22,
        .94
    );

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:15px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);
}

.panel-title{
    font-size:14px;
    font-weight:700;

    margin-bottom:9px;
}

.layer{
    display:flex;
    align-items:center;

    gap:9px;

    padding:10px;

    background:
        rgba(255,255,255,.05);

    border-radius:9px;
}

.layer input{
    width:18px;
    height:18px;
}

.layer-name{
    font-size:13px;
    font-weight:650;
}

.layer-desc{
    margin-top:2px;

    color:#8c97a6;

    font-size:10px;
}

.buttons{
    display:flex;
    gap:6px;

    margin-top:8px;
}

button{
    flex:1;

    border:0;
    border-radius:9px;

    padding:10px 8px;

    background:#252d37;

    color:#fff;

    font-size:12px;
    font-weight:650;
}

button.primary{
    background:#315eea;
}


/* =========================
   INFO
========================= */

.info{
    margin-top:9px;

    padding:9px;

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    color:#9ca7b5;

    font-size:10px;

    line-height:1.45;
}


/* =========================
   LOADING
========================= */

.loading{
    position:absolute;

    z-index:1200;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    padding:12px 17px;

    border-radius:11px;

    background:
        rgba(7,10,14,.95);

    color:#fff;

    font-size:13px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.4);
}

.hidden{
    display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{
        top:8px;

        width:
            calc(100% - 16px);
    }

    .logo{
        font-size:14px;
    }

    .panel{
        top:64px;
        right:8px;

        width:210px;
    }

}

</style>
</head>

<body>


<div id="map"></div>


<div class="topbar">

    <div class="logo">
        MELORAG
    </div>

    <div class="status">

        <span
            id="statusDot"
            class="dot loading">
        </span>

        <span id="statusText">
            Подключение...
        </span>

    </div>

</div>


<div class="panel">

    <div class="panel-title">
        Радарные слои
    </div>


    <label class="layer">

        <input
            id="radarToggle"
            type="checkbox"
            checked
        >

        <div>

            <div class="layer-name">
                Nowcast DBZ
            </div>

            <div class="layer-desc">
                Радиолокационная отражаемость
            </div>

        </div>

    </label>


    <div class="buttons">

        <button
            id="refresh"
            class="primary">
            Обновить
        </button>

        <button
            id="russia">
            Россия
        </button>

    </div>


    <div class="info">

        Время:
        <b id="radarTime">—</b>

        <br>

        PNG:
        <b id="pngSize">—</b>

        <br>

        BBOX:
        <b>EPSG:3857</b>

    </div>

</div>


<div
    id="loading"
    class="loading hidden">
    Загрузка радара...
</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================================
   CONFIG
========================================================= */


/*
   Твой Cloudflare Worker.
*/

const WORKER =
    "https://melorag.mmts2678.workers.dev/nowcast?url=";


/*
   Слои Nowcast.
*/

const LAYERS =
    "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";


/*
   BBOX, который ты уже проверил
   и на котором Nowcast возвращал HTTP 200 PNG.
*/

const BBOX3857 = {

    minX:
        3779329.325563706,

    minY:
        6713602.321820984,

    maxX:
        4547368.585773157,

    maxY:
        8244788.872429635

};


/* =========================================================
   MAP
========================================================= */

const map =
    L.map(
        "map",
        {
            zoomControl:true
        }
    );


/*
   OpenStreetMap.
   API KEY НЕ НУЖЕН.
*/

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,

        attribution:
            "© OpenStreetMap contributors"
    }
).addTo(map);


/*
   Показываем область,
   которую покрывает наш BBOX.
*/

const initialBounds =
    mercatorBoundsToLeaflet(
        BBOX3857
    );


map.fitBounds(
    initialBounds
);


/* =========================================================
   UI
========================================================= */

const statusText =
    document.getElementById(
        "statusText"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const loading =
    document.getElementById(
        "loading"
    );

const radarTime =
    document.getElementById(
        "radarTime"
    );

const pngSize =
    document.getElementById(
        "pngSize"
    );

const radarToggle =
    document.getElementById(
        "radarToggle"
    );


/* =========================================================
   STATE
========================================================= */

let radarLayer =
    null;

let objectURL =
    null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type
){

    statusText.textContent =
        text;

    statusDot.className =
        "dot " + type;
}


/* =========================================================
   MERCATOR → LAT/LON
========================================================= */


/*
   EPSG:3857:

   X → longitude

   Y → latitude
*/

function mercatorXToLon(
    x
){

    return (
        x /
        20037508.34
    ) * 180;

}


function mercatorYToLat(
    y
){

    const degrees =
        y /
        20037508.34 *
        180;


    const radians =
        degrees *
        Math.PI /
        180;


    return (
        180 /
        Math.PI
    ) *
    (
        2 *
        Math.atan(
            Math.exp(
                radians
            )
        )
        -
        Math.PI / 2
    );

}


/*
   Преобразуем весь BBOX.
*/

function mercatorBoundsToLeaflet(
    bbox
){

    const west =
        mercatorXToLon(
            bbox.minX
        );

    const east =
        mercatorXToLon(
            bbox.maxX
        );

    const south =
        mercatorYToLat(
            bbox.minY
        );

    const north =
        mercatorYToLat(
            bbox.maxY
        );


    return [

        [
            south,
            west
        ],

        [
            north,
            east
        ]

    ];

}


/* =========================================================
   TIME
========================================================= */

function getRadarTime(){

    const now =
        new Date();


    /*
       Nowcast кадры идут
       с шагом 10 минут.
    */

    now.setUTCSeconds(
        0,
        0
    );


    now.setUTCMinutes(
        Math.floor(
            now.getUTCMinutes() /
            10
        ) * 10
    );


    return now
        .toISOString()
        .replace(
            ".000Z",
            "Z"
        );

}


/* =========================================================
   GETMAP URL
========================================================= */

function makeGetMapURL(
    time
){

    const url =
        new URL(
            "https://www.nowcast.ru/baltrad_wsgi"
        );


    url.searchParams.set(
        "REQUEST",
        "GetMap"
    );

    url.searchParams.set(
        "SERVICE",
        "WMS"
    );

    url.searchParams.set(
        "VERSION",
        "1.3.0"
    );

    url.searchParams.set(
        "FORMAT",
        "image/png"
    );

    url.searchParams.set(
        "STYLES",
        ""
    );

    url.searchParams.set(
        "TRANSPARENT",
        "TRUE"
    );

    url.searchParams.set(
        "LAYERS",
        LAYERS
    );

    url.searchParams.set(
        "TIME",
        time
    );

    url.searchParams.set(
        "FORMAT_OPTIONS",
        "dpi:270"
    );

    url.searchParams.set(
        "WIDTH",
        "942"
    );

    url.searchParams.set(
        "HEIGHT",
        "1878"
    );

    url.searchParams.set(
        "CRS",
        "EPSG:3857"
    );

    url.searchParams.set(
        "BBOX",

        [
            BBOX3857.minX,
            BBOX3857.minY,
            BBOX3857.maxX,
            BBOX3857.maxY
        ].join(",")
    );


    return url.toString();

}


/* =========================================================
   LOAD PNG
========================================================= */

async function loadRadar(){

    try{

        loading.classList.remove(
            "hidden"
        );

        loading.textContent =
            "Получение Nowcast PNG...";


        setStatus(
            "Загрузка...",
            "loading"
        );


        const time =
            getRadarTime();


        const nowcastURL =
            makeGetMapURL(
                time
            );


        /*
           GitHub → Worker → Nowcast
        */

        const response =
            await fetch(
                WORKER +
                encodeURIComponent(
                    nowcastURL
                ),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }


        const blob =
            await response.blob();


        if(
            !blob.type.includes(
                "image"
            )
        ){

            throw new Error(
                "Получен не PNG: " +
                blob.type
            );

        }


        /*
           Размер полученного PNG.
        */

        pngSize.textContent =
            Math.round(
                blob.size / 1024
            ) +
            " KB";


        radarTime.textContent =
            time;


        /*
           Старый слой удаляем.
        */

        if(radarLayer){

            map.removeLayer(
                radarLayer
            );

        }


        if(objectURL){

            URL.revokeObjectURL(
                objectURL
            );

        }


        objectURL =
            URL.createObjectURL(
                blob
            );


        /*
           Точная географическая
           привязка через BBOX.
        */

        radarLayer =
            L.imageOverlay(

                objectURL,

                mercatorBoundsToLeaflet(
                    BBOX3857
                ),

                {
                    opacity:.90,

                    interactive:false
                }

            );


        if(
            radarToggle.checked
        ){

            radarLayer.addTo(
                map
            );

        }


        setStatus(
            "Nowcast подключён",
            "ok"
        );


        loading.classList.add(
            "hidden"
        );


    }catch(error){

        console.error(
            error
        );


        setStatus(
            "Ошибка",
            "error"
        );


        loading.textContent =
            "Ошибка: " +
            error.message;


        loading.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   TOGGLE
========================================================= */

radarToggle.addEventListener(
    "change",
    () => {

        if(!radarLayer)
            return;


        if(
            radarToggle.checked
        ){

            radarLayer.addTo(
                map
            );

        }else{

            map.removeLayer(
                radarLayer
            );

        }

    }
);


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "refresh"
).onclick =
    loadRadar;


document.getElementById(
    "russia"
).onclick =
    () => {

        map.setView(
            [58,90],
            3
        );

    };


/* =========================================================
   START
========================================================= */

loadRadar();


/*
   Проверяем новый кадр
   раз в минуту.
*/

setInterval(
    loadRadar,
    60000
);

</script>

</body>
</html>
