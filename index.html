<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>Nowcast Radar</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body,
#map{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#0b0f14;
    color:#fff;
}

#map{
    position:absolute;
    inset:0;
    background:#111820;
}


/* =========================
   TOP BAR
========================= */

.top{
    position:absolute;
    z-index:1000;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    width:min(
        720px,
        calc(100% - 24px)
    );

    min-height:52px;

    padding:8px 12px;

    display:flex;
    align-items:center;

    gap:12px;

    background:rgba(
        13,
        17,
        23,
        .93
    );

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:15px;

    backdrop-filter:blur(14px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.30);
}

.logo{
    font-size:16px;
    font-weight:750;

    white-space:nowrap;
}

.status{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:7px;

    color:#aab4c1;

    font-size:12px;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#777;
}

.dot.ok{
    background:#35d47a;

    box-shadow:
        0 0 9px
        #35d47a;
}

.dot.load{
    background:#f2b84b;
}

.dot.error{
    background:#ff4d4d;
}


/* =========================
   RIGHT PANEL
========================= */

.panel{
    position:absolute;
    z-index:1000;

    top:76px;
    right:12px;

    width:235px;

    padding:12px;

    background:rgba(
        13,
        17,
        23,
        .93
    );

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:15px;

    backdrop-filter:blur(14px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);
}

.title{
    font-weight:700;
    font-size:14px;

    margin-bottom:9px;
}

.layer{
    display:flex;
    align-items:center;

    gap:9px;

    padding:10px;

    background:
        rgba(255,255,255,.05);

    border-radius:9px;
}

.layer input{
    width:18px;
    height:18px;
}

.layer b{
    font-size:13px;
}

.layer small{
    display:block;

    color:#8d98a7;

    font-size:10px;

    margin-top:2px;
}

.buttons{
    display:flex;

    gap:6px;

    margin-top:8px;
}

button{
    flex:1;

    border:0;
    border-radius:9px;

    padding:9px;

    background:#252c35;

    color:#fff;

    font-size:12px;
    font-weight:650;
}

button.primary{
    background:#315eea;
}

button:active{
    transform:scale(.98);
}


/* =========================
   TIMELINE
========================= */

.timeline{
    position:absolute;

    z-index:1000;

    left:50%;

    transform:translateX(-50%);

    bottom:12px;

    width:min(
        850px,
        calc(100% - 24px)
    );

    padding:11px 13px;

    background:rgba(
        13,
        17,
        23,
        .94
    );

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:15px;

    backdrop-filter:blur(14px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);
}

.time{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:7px;
}

.time b{
    font-size:13px;
}

.time span{
    color:#8994a3;

    font-size:11px;
}


/*
   УВЕЛИЧЕННЫЙ ПОЛЗУНОК
*/

#slider{

    width:100%;

    height:18px;

    margin:2px 0;

    cursor:pointer;

    accent-color:#4775ff;
}


/*
   Делаем сам трек толще.
*/

#slider::-webkit-slider-runnable-track{

    height:8px;

    border-radius:8px;

    background:#3a424d;
}

#slider::-moz-range-track{

    height:8px;

    border-radius:8px;

    background:#3a424d;
}


/*
   Большой бегунок.
*/

#slider::-webkit-slider-thumb{

    -webkit-appearance:none;

    appearance:none;

    width:20px;
    height:20px;

    margin-top:-6px;

    border-radius:50%;

    background:#4775ff;

    border:2px solid #fff;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.4);
}

#slider::-moz-range-thumb{

    width:20px;
    height:20px;

    border-radius:50%;

    background:#4775ff;

    border:2px solid #fff;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.4);
}


.controls{
    display:flex;

    gap:6px;

    margin-top:7px;
}

.controls button{
    height:34px;
}

.play{
    flex:1;

    background:#315eea;
}


/* =========================
   LOADING
========================= */

.loading{
    position:absolute;

    z-index:1200;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    padding:12px 17px;

    background:
        rgba(8,11,15,.94);

    border-radius:11px;

    font-size:13px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);
}

.hidden{
    display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        top:8px;

        width:
            calc(100% - 16px);

        min-height:46px;
    }

    .logo{
        font-size:14px;
    }

    .status{
        font-size:10px;
    }

    .panel{
        top:64px;
        right:8px;

        width:205px;
    }

    .timeline{
        bottom:8px;

        width:
            calc(100% - 16px);

        padding:9px 10px;
    }

}

@media(max-width:390px){

    .status{
        display:none;
    }

    .panel{
        width:195px;
    }

}

</style>
</head>

<body>


<div id="map"></div>


<!-- =========================
     TOP
========================= -->

<div class="top">

    <div class="logo">
        NOWCAST RADAR
    </div>

    <div class="status">

        <span
            id="dot"
            class="dot load">
        </span>

        <span id="status">
            Подключение...
        </span>

    </div>

</div>


<!-- =========================
     PANEL
========================= -->

<div class="panel">

    <div class="title">
        Радарные слои
    </div>


    <label class="layer">

        <input
            id="radar"
            type="checkbox"
            checked
        >

        <div>

            <b>Nowcast DBZ</b>

            <small>
                Радиолокационная отражаемость
            </small>

        </div>

    </label>


    <div class="buttons">

        <button
            id="refresh"
            class="primary">
            Обновить
        </button>

        <button id="russia">
            Россия
        </button>

    </div>

</div>


<!-- =========================
     LOADING
========================= -->

<div
    id="loading"
    class="loading hidden">

    Загрузка радара...

</div>


<!-- =========================
     TIMELINE
========================= -->

<div class="timeline">

    <div class="time">

        <b id="time">
            Нет данных
        </b>

        <span id="count">
            0 кадров
        </span>

    </div>


    <input
        id="slider"
        type="range"
        min="0"
        max="0"
        value="0"
        step="1"
    >


    <div class="controls">

        <button id="prev">
            ◀
        </button>

        <button
            id="play"
            class="play">

            ▶ Воспроизвести

        </button>

        <button id="next">
            ▶
        </button>

    </div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const WORKER =
    "https://melorag.mmts2678.workers.dev/nowcast?url=";


const LAYERS =
    "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";


/*
   Проверенный BBOX Nowcast.
*/

const BBOX = [
    3779329.325563706,
    6713602.321820984,
    4547368.585773157,
    8244788.872429635
];


/* =========================================================
   MAP
========================================================= */

const map =
    L.map(
        "map",
        {
            zoomControl:true,
            attributionControl:true
        }
    );


/*
   Обычная карта без API-ключа.
*/

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,

        attribution:
            "© OpenStreetMap contributors"
    }
).addTo(map);


/*
   Начальная позиция.
*/

map.setView(
    [57,80],
    3
);


/* =========================================================
   UI
========================================================= */

const status =
    document.getElementById(
        "status"
    );

const dot =
    document.getElementById(
        "dot"
    );

const loading =
    document.getElementById(
        "loading"
    );

const timeBox =
    document.getElementById(
        "time"
    );

const countBox =
    document.getElementById(
        "count"
    );

const slider =
    document.getElementById(
        "slider"
    );

const radarToggle =
    document.getElementById(
        "radar"
    );


/* =========================================================
   STATE
========================================================= */

let frames = [];

let currentIndex = -1;

let radarLayer = null;

let objectURL = null;

let playing = false;

let playTimer = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type
){

    status.textContent =
        text;

    dot.className =
        "dot " + type;
}


/* =========================================================
   TIME
========================================================= */

function radarTime(){

    const date =
        new Date();


    date.setUTCSeconds(
        0,
        0
    );


    date.setUTCMinutes(
        Math.floor(
            date.getUTCMinutes() /
            10
        ) * 10
    );


    return date
        .toISOString()
        .replace(
            ".000Z",
            "Z"
        );
}


/* =========================================================
   MERCATOR → LAT/LON
========================================================= */

function xToLon(
    x
){

    return (
        x /
        20037508.34
    ) * 180;

}


function yToLat(
    y
){

    const degrees =
        y /
        20037508.34 *
        180;


    const radians =
        degrees *
        Math.PI /
        180;


    return (
        180 /
        Math.PI
    ) *
    (
        2 *
        Math.atan(
            Math.exp(
                radians
            )
        )
        -
        Math.PI / 2
    );

}


function radarBounds(){

    return [

        [
            yToLat(
                BBOX[1]
            ),

            xToLon(
                BBOX[0]
            )
        ],

        [
            yToLat(
                BBOX[3]
            ),

            xToLon(
                BBOX[2]
            )
        ]

    ];

}


/* =========================================================
   GETMAP
========================================================= */

function getMapURL(
    time
){

    const url =
        new URL(
            "https://www.nowcast.ru/baltrad_wsgi"
        );


    url.searchParams.set(
        "REQUEST",
        "GetMap"
    );

    url.searchParams.set(
        "SERVICE",
        "WMS"
    );

    url.searchParams.set(
        "VERSION",
        "1.3.0"
    );

    url.searchParams.set(
        "FORMAT",
        "image/png"
    );

    url.searchParams.set(
        "STYLES",
        ""
    );

    url.searchParams.set(
        "TRANSPARENT",
        "TRUE"
    );

    url.searchParams.set(
        "LAYERS",
        LAYERS
    );

    url.searchParams.set(
        "TIME",
        time
    );

    url.searchParams.set(
        "FORMAT_OPTIONS",
        "dpi:270"
    );

    url.searchParams.set(
        "WIDTH",
        "942"
    );

    url.searchParams.set(
        "HEIGHT",
        "1878"
    );

    url.searchParams.set(
        "CRS",
        "EPSG:3857"
    );

    url.searchParams.set(
        "BBOX",
        BBOX.join(",")
    );


    return url.toString();

}


/* =========================================================
   LOAD RADAR
========================================================= */

async function loadRadar(){

    try{

        loading.classList.remove(
            "hidden"
        );

        loading.textContent =
            "Загрузка Nowcast...";


        setStatus(
            "Загрузка...",
            "load"
        );


        const time =
            radarTime();


        const target =
            getMapURL(
                time
            );


        const response =
            await fetch(
                WORKER +
                encodeURIComponent(
                    target
                ),

                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }


        const blob =
            await response.blob();


        if(
            !blob.type.includes(
                "image"
            )
        ){

            throw new Error(
                "Получен не PNG: " +
                blob.type
            );

        }


        /*
           Не удаляем старые кадры,
           пока не проверили новый.
        */

        const existing =
            frames.findIndex(
                frame =>
                    frame.time === time
            );


        if(existing === -1){

            frames.push({
                time:time,
                blob:blob
            });

        }else{

            frames[existing].blob =
                blob;

        }


        /*
           Максимум 60 кадров.
        */

        while(
            frames.length > 60
        ){

            frames.shift();

        }


        frames.sort(
            (
                a,
                b
            ) =>
                new Date(a.time) -
                new Date(b.time)
        );


        const index =
            frames.findIndex(
                frame =>
                    frame.time === time
            );


        showFrame(
            index
        );


        setStatus(
            "Nowcast подключён",
            "ok"
        );


        loading.classList.add(
            "hidden"
        );


    }catch(error){

        console.error(
            error
        );


        setStatus(
            "Ошибка загрузки",
            "error"
        );


        loading.textContent =
            "Ошибка: " +
            error.message;


        loading.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   SHOW FRAME
========================================================= */

function showFrame(
    index
){

    if(
        index < 0 ||
        index >= frames.length
    ){

        return;

    }


    currentIndex =
        index;


    const frame =
        frames[index];


    if(radarLayer){

        map.removeLayer(
            radarLayer
        );

    }


    if(objectURL){

        URL.revokeObjectURL(
            objectURL
        );

    }


    objectURL =
        URL.createObjectURL(
            frame.blob
        );


    radarLayer =
        L.imageOverlay(

            objectURL,

            radarBounds(),

            {
                opacity:.92,
                interactive:false
            }

        );


    if(
        radarToggle.checked
    ){

        radarLayer.addTo(
            map
        );

    }


    timeBox.textContent =
        new Date(
            frame.time
        ).toLocaleString(
            "ru-RU",
            {
                day:"2-digit",
                month:"2-digit",
                hour:"2-digit",
                minute:"2-digit",

                timeZone:"UTC"
            }
        ) +
        " UTC";


    countBox.textContent =
        (
            index + 1
        ) +
        " / " +
        frames.length;


    slider.max =
        Math.max(
            0,
            frames.length - 1
        );


    slider.value =
        index;

}


/* =========================================================
   SLIDER
========================================================= */

slider.addEventListener(
    "input",
    () => {

        showFrame(
            Number(
                slider.value
            )
        );

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

document.getElementById(
    "prev"
).onclick =
() => {

    if(!frames.length)
        return;


    showFrame(
        Math.max(
            0,
            currentIndex - 1
        )
    );

};


/* =========================================================
   NEXT
========================================================= */

document.getElementById(
    "next"
).onclick =
() => {

    if(!frames.length)
        return;


    showFrame(
        Math.min(
            frames.length - 1,
            currentIndex + 1
        )
    );

};


/* =========================================================
   PLAY
========================================================= */

document.getElementById(
    "play"
).onclick =
() => {

    if(
        frames.length < 2
    ){

        return;

    }


    if(playing){

        playing =
            false;


        clearInterval(
            playTimer
        );


        document.getElementById(
            "play"
        ).textContent =
            "▶ Воспроизвести";


        return;

    }


    playing =
        true;


    document.getElementById(
        "play"
    ).textContent =
        "⏸ Пауза";


    playTimer =
        setInterval(
            () => {

                let next =
                    currentIndex + 1;


                if(
                    next >=
                    frames.length
                ){

                    next = 0;

                }


                showFrame(
                    next
                );

            },
            700
        );

};


/* =========================================================
   RADAR TOGGLE
========================================================= */

radarToggle.onchange =
() => {

    if(!radarLayer)
        return;


    if(
        radarToggle.checked
    ){

        radarLayer.addTo(
            map
        );

    }else{

        map.removeLayer(
            radarLayer
        );

    }

};


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "refresh"
).onclick =
    loadRadar;


document.getElementById(
    "russia"
).onclick =
() => {

    map.setView(
        [58,90],
        3
    );

};


/* =========================================================
   START
========================================================= */

loadRadar();


/*
   Автообновление.
*/

setInterval(
    loadRadar,
    60000
);

</script>

</body>
</html>
